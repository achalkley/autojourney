[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autojourney"
version = "0.1.0"
description = "Capture iOS app sessions and produce visual journey maps in Figma"
requires-python = ">=3.11"
dependencies = [
    "opencv-python>=4.9",
    "numpy>=1.26",
    "openai>=1.30",          # OpenAI-compat client — used for LM Studio local API
    "networkx>=2.8",
    "click>=8.1",
    "rich>=13.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
capture = [
    "ios-screen-record>=0.3",  # USB QuickTime capture
]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff",
    "mypy",
]

[project.scripts]
autojourney = "autojourney.cli.main:cli"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"autojourney.figma_plugin" = ["*.json", "*.js", "*.html"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = false

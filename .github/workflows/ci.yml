name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e '.[dev]'

      - name: ruff
        run: ruff check .

      - name: pytest
        run: pytest

      - name: mypy (advisory — not yet clean, see CLAUDE.md)
        run: mypy autojourney
        continue-on-error: true
